name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # agent extra 不装（torch 下载大）——agent.py 依赖全懒加载，
      # 单测一律 mock sys.modules/属性，无需真实模型运行时
      - name: Install dependencies
        run: pip install -e ".[test,repl]"

      # 覆盖率门禁只卡 ubuntu cell：win/mac 有 POSIX-only skip 用例，
      # 覆盖率水位不同步，若同挂 fail-under 会误伤跨平台 PR。
      # 门禁：当前实测 ~59%，卡 58 防水位倒退，后续补用例后逐步上调至 60+
      - name: Run unit tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: pytest -m "not integration" --cov=dp_cli --cov-report=xml --cov-report=term-missing --cov-fail-under=58

      # 误绿防护：非 ubuntu cell 若 import 全挂/全 skip，pytest 可
      # 静默绿——tee 输出后断言 "N passed" 且 N>0。shell: bash 在
      # windows runner 走 Git Bash（镜像自带），mac/linux 原生。
      - name: Run unit tests
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          set -o pipefail
          pytest -m "not integration" -q --tb=short 2>&1 | tee pytest.out
          if ! grep -qE '[1-9][0-9]* passed' pytest.out; then
            echo "::error::0 tests passed on ${{ matrix.os }}——import 全挂/全 skip 被静默吞"
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ── 集成测试(需要真实浏览器)──────────────────────────────────────────────
  # bridge 端到端用例与真实 Chrome 冒烟用例(headless)在此运行。
  integration:
    name: Integration Tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[test,repl]"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run integration tests (headless)
        run: pytest -m "integration" --timeout=120

      # hostile 冒烟：事件断言页验证 click 变体真实触发
      # （file:// fixture 无外网依赖）
      - name: Hostile smoke (event assertions)
        run: python scripts/smoke_hostile.py
