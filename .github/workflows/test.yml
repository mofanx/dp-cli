name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[test,repl]"

      # 覆盖率门禁：当前实测 ~59%，卡 58 防水位倒退，后续补用例后逐步上调至 60+
      - name: Run unit tests with coverage
        run: pytest -m "not integration" --cov=dp_cli --cov-report=xml --cov-report=term-missing --cov-fail-under=58

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ── 集成测试(需要真实浏览器)──────────────────────────────────────────────
  # bridge 端到端用例与真实 Chrome 冒烟用例(headless)在此运行。
  integration:
    name: Integration Tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[test,repl]"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run integration tests (headless)
        run: pytest -m "integration" --timeout=120

      # hostile 冒烟：事件断言页验证 click 变体真实触发
      # （file:// fixture 无外网依赖）
      - name: Hostile smoke (event assertions)
        run: python scripts/smoke_hostile.py
