[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dp-cli"
version = "0.13.0"
description = "A powerful CLI for DrissionPage — browser automation, structured data extraction, network listening and more."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
keywords = ["drissionpage", "browser", "automation", "cli", "web-scraping"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Topic :: Utilities",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "DrissionPage>=4.0",
    "click>=8.0",
    "aiohttp>=3.9",
    "websockets>=12",
    "requests>=2.28",
]

[project.optional-dependencies]
tls = [
    "curl_cffi>=0.7.0",
]
extract = [
    "trafilatura>=1.6.0",
    "readability-lxml>=0.8.1",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.1.0",
    "pytest-mock>=3.11.0",
]

[project.scripts]
# 主入口：DrissionPage 4.1.1.4+ 抢注了 dp（浏览器配置工具），
# dpx 为独占命名，永远指向本 CLI。
dpx = "dp_cli.main:main"
# 兼容入口：最佳努力保留——装在本包之后的场景仍可用；
# 被 DrissionPage 抢占时 install --check 会预警。
dp = "dp_cli.main:main"

[project.urls]
Homepage = "https://github.com/mofanx/dp-cli"
Repository = "https://github.com/mofanx/dp-cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["dp_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--timeout=60",
]
markers = [
    "unit: marks tests as unit tests (no browser required)",
    "integration: marks tests as integration tests (browser required)",
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "network: marks tests that require network access",
]

[tool.coverage.run]
source = ["dp_cli"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
